[versions]
# Build — AGP 9 (Kotlin intégré à AGP : plus de plugin `org.jetbrains.kotlin.android`).
# Migré le 2026-09-14 : compose 1.12, core 1.19, lifecycle 2.11, navigation 2.10 et
# hilt-navigation-compose 1.4 exigent AGP 9.1+ et compileSdk 37 (mesuré sur la CI des PR Dependabot).
agp = "9.4.0"
# Kotlin reste en 2.3.20 : CodeQL 2.27 refuse de compiler au-delà (« Kotlin version 2.4.20 is too
# recent. CodeQL currently supports versions below 2.4.20 », mesuré sur la PR #14). Ignoré dans
# .github/dependabot.yml jusqu'à ce que CodeQL le supporte.
kotlin = "2.4.10"
ksp = "2.3.12"
java = "17"

# AndroidX / Compose
compose-bom = "2026.09.00"
core-ktx = "1.19.0"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
navigation-compose = "2.10.1"
room = "2.8.5"
# Alignee sur kotlinx-serialization-core deja resolu transitivement (lifecycle) : evite un conflit.
kotlinxSerialization = "1.11.0"
datastore = "1.1.1"
biometric = "1.1.0"
splashscreen = "1.2.0"

# Hilt — 2.60 exige AGP 9.0+ (mesuré). L'ancien commentaire « 2.58+ exige AGP 9 » était faux :
# SMS Tech publie en Hilt 2.58 sous AGP 8.13.2.
hilt = "2.60.1"
hilt-navigation-compose = "1.4.0"

# Coroutines
coroutines = "1.11.0"

# SQLCipher — base chiffrée at-rest (embarque sa propre SQLite).
sqlcipher = "4.16.0"

# Glance (home-screen widget)
glance = "1.1.1"

# WorkManager + SAF — sauvegarde automatique planifiée.
# Épinglés sur ce que Glance 1.1.1 résout DÉJÀ dans le classpath : les déclarer explicitement ne
# change aucun artefact résolu, donc ne touche pas à la build reproductible que la MR F-Droid
# !42991 fait vérifier. À remonter une fois la MR fusionnée, pas avant.
work = "2.7.1"
documentfile = "1.0.0"

# Logging
timber = "5.0.1"

# Tests
junit5 = "5.11.3"
mockk = "1.14.11"
turbine = "1.2.1"
truth = "1.4.4"
robolectric = "4.17"
androidx-test-ext = "1.3.0"
androidx-test-runner = "1.7.0"
espresso = "3.7.0"

# Quality
detekt = "1.23.8"
ktlint-gradle = "14.2.0"

[libraries]
# AndroidX core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }

# Lifecycle
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Compose
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# Navigation
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }

# Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# DataStore (settings)
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Biometric (app lock)
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Glance
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }

# WorkManager + Storage Access Framework
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }

# SQLCipher
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }

# Logging
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# Tests
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit5" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit5" }
# Gradle 9 ne fournit plus le lanceur : sans lui, « Failed to load JUnit Platform » avant le 1er test.
# Plateforme 1.11.x = Jupiter 5.11.x, les deux se suivent.
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.11.3" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockk-android = { module = "io.mockk:mockk-android", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

# Detekt
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
