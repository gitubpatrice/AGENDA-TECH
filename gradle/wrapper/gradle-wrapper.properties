distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
# Empreinte officielle publiee par Gradle (gradle-8.13-bin.zip.sha256).
# Le wrapper refuse de demarrer si la distribution telechargee n'y correspond pas : c'est le
# seul maillon de la chaine de build qui n'etait pas verifie, dans un projet qui argumente
# par ailleurs longuement sur la reproductibilite (cf. settings.gradle.kts, retrait de foojay).
# Verifiee pour de bon au premier run CI, qui part d'un cache vide et telecharge la distribution.
distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
