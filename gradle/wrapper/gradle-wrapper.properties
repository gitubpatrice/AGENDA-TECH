distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.1-bin.zip
# Empreinte officielle publiee par Gradle (gradle-9.8.0-bin.zip.sha256).
# Le wrapper refuse de demarrer si la distribution telechargee n'y correspond pas : c'est le
# seul maillon de la chaine de build qui n'etait pas verifie, dans un projet qui argumente
# par ailleurs longuement sur la reproductibilite (cf. settings.gradle.kts, retrait de foojay).
# Verifiee pour de bon au premier run CI, qui part d'un cache vide et telecharge la distribution.
distributionSha256Sum=dce76f55f8e251a3a1f130eb120f30b3d271de2b76c9b0729d316b5a1b6dc01f
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
