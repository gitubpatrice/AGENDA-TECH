# Source unique de vérité de la version publiée.
#
# versionCode DOIT être strictement croissant : Android refuse d'installer un APK dont le
# versionCode est inférieur à celui déjà installé — l'utilisateur voit juste un échec incompréhensible.
# Il était auparavant dérivé de `git rev-list --count HEAD`, ce qui le rendait fragile :
#   - un rebase / squash / une greffe d'historique le fait BAISSER ;
#   - un build hors dépôt git (archive source) retombait silencieusement à 1.
# Le figer ici le rend explicite, reproductible et indépendant de l'historique.
#
# À bumper À LA MAIN à chaque release (et seulement là), avant de builder l'APK.
# 51 = la v0.5.4 publiée (release GitHub du 01/08/2026).
# 52 = la v1.0.0 : cinq passes d'audit (base et migrations, import .ics, crypto de sauvegarde,
#      alarmes, widget et notifications, interactions), detekt ramené de 520 à 0 sans baseline,
#      et la première exécution de la CI de l'histoire du dépôt.
# 53 = la v1.0.1 : AUCUN changement de code. La description du magasin passe du Markdown
#      (que F-Droid affichait tel quel, soulignements « === » compris) au HTML qu'il met
#      en forme. Un nouveau tag est nécessaire parce que F-Droid lit les métadonnées
#      fastlane dans l'arbre du commit référencé par l'entrée de build, pas au HEAD
#      (fdroiddata/tools/check-fastlane.py : vcs.gotorevision(build.commit)).
# 54 = la v1.0.2 : retrait du plugin foojay-resolver de settings.gradle.kts, ce qui rend le
#      build REPRODUCTIBLE. Mesuré : sa présence changeait classes.dex (R8 renommait autrement,
#      +7 field_ids) et le profil ART. Comme la recette F-Droid le retirait par sed alors que la
#      release était construite avec, les deux binaires ne pouvaient pas coïncider — ce qui
#      interdisait Binaries/AllowedAPKSigningKeys, donc la signature Files Tech sur F-Droid.
#      Aucun changement fonctionnel.
# 55 = la v1.0.3 : `dependenciesInfo { includeInApk = false }`. AGP glissait la liste chiffree
#      de nos dependances dans le bloc de signature de l'APK, a destination de la console Play.
#      Le scanner F-Droid le refuse (« extra signing block 'Dependency metadata' ») et il ne
#      pouvait pas apparaitre avant : tant que `Binaries:` n'etait pas declare, il n'analysait
#      que l'APK NON SIGNE qu'il reconstruisait. Aucun changement fonctionnel.
# 56 = la v1.1.0 : MINEUR, trois fonctionnalites nouvelles (sauvegarde chiffree automatique
#      hebdomadaire, evenements d'anniversaire avec age derive, duplication d'un evenement),
#      et l'audit global du 2026-09-11 : 20 constats corriges plus les 6 deviations de
#      coherence. Le plus grave etait un .ics « toute la journee » sans DTEND, qui s'importait
#      et devenait invisible dans les vues par jour. Widgets refaits aux couleurs du logo.
# 57 = la v1.1.1 : CORRECTIF. Avec le verrou PIN, la restauration s'arretait apres le PIN (le
#      selecteur de fichier verrouillait l'app, et deverrouiller reconstruisait la navigation
#      sur le mois) ; sur Android 8 a 11, un Keystore muet un instant faisait recreer la cle et
#      effacait l'agenda. Chaine de build : AGP 9.4, Gradle 9.7.1, Kotlin 2.4.10, compileSdk 37,
#      SQLCipher 4.19 (base 1.1.0 ouverte en place sur S9).
# 58 = la v1.2.0 : MINEUR. Le mois en trois affichages (points, titres dans la grille, une ligne
#      par jour), demande d'un utilisateur ; allemand, italien et espagnol ; journees entieres
#      lues dans leur propre fuseau partout, et application ouverte qui suit un changement de
#      fuseau ou de langue ; SQLCipher 4.19.1.
# 59 = la v1.3.0 : MINEUR. Jours feries de dix pays, calcules sur le telephone ; partage d'un
#      evenement en texte ou en .ics (FileProvider non exporte, copie effacee avec l'evenement) ;
#      annulation d'une suppression ; un lieu ouvert dans l'appli de cartes depuis son adresse ou son
#      nom ; lieu et description dans la liste du jour ; la vue Semaine affiche enfin les journees
#      entieres. Aucune dependance changee.
# 60 = la v1.3.1 : CORRECTIF. Un .ics exporte puis reimporte doublait chaque evenement cree sur le
#      telephone, une copie de plus a chaque aller-retour : il sortait sous l'UID row-<id>, que rien
#      ne reconnaissait, et que tous les telephones ecrivaient. Identite aleatoire donnee a la premiere
#      sortie (export ou partage) ; l'import la retrouve dans tous les agendas sans toucher a ce que le
#      fichier ne porte pas. Aucune dependance changee.
# 61 = la v1.3.2 : CORRECTIF. Les trois defauts d'affichage vus en testant la 1.3.0 : le « +N » de la
#      Semaine deplie la rangee des journees entieres ; un ferie sans evenement s'affiche sous sa date ;
#      le libelle d'un interrupteur ou d'un bouton radio agit. Trouves en chemin : la couleur par defaut
#      sans gris ni lavande sur petit ecran, et des pastilles et interrupteurs sans nom pour TalkBack.
#      Aucune dependance changee.
# 62 = la v1.3.3 : CORRECTIF. Le widget restait un pave bleu en release (issue #37) : R8 retirait le
#      constructeur de l'InputMerger que WorkManager 2.7.1 instancie par reflexion, et tout travail
#      ponctuel - la session Glance comprise - echouait avant de demarrer. Et le widget lisait ses
#      donnees une fois, hors composition : un changement fait dans les 45 s d'un rendu (verrou compris)
#      n'arrivait qu'au rafraichissement suivant. Aucune dependance changee.
# 63 = la v1.3.4 : CORRECTIF. La barre de selection proposait « Traduire » (classifieur de texte) et
#      les actions de texte des autres applis, qui recevaient le texte selectionne ; ferme sur toutes
#      les versions d'Android (#50). Textes juridiques precises (#49). Aucune dependance changee.
versionCode=63
versionName=1.3.4
