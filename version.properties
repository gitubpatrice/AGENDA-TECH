# Source unique de vérité de la version publiée.
#
# versionCode DOIT être strictement croissant : Android refuse d'installer un APK dont le
# versionCode est inférieur à celui déjà installé — l'utilisateur voit juste un échec incompréhensible.
# Il était auparavant dérivé de `git rev-list --count HEAD`, ce qui le rendait fragile :
#   - un rebase / squash / une greffe d'historique le fait BAISSER ;
#   - un build hors dépôt git (archive source) retombait silencieusement à 1.
# Le figer ici le rend explicite, reproductible et indépendant de l'historique.
#
# À bumper À LA MAIN à chaque release (et seulement là), avant de builder l'APK.
# 51 = la v0.5.4 publiée (release GitHub du 01/08/2026).
# 52 = la v1.0.0 : cinq passes d'audit (base et migrations, import .ics, crypto de sauvegarde,
#      alarmes, widget et notifications, interactions), detekt ramené de 520 à 0 sans baseline,
#      et la première exécution de la CI de l'histoire du dépôt.
# 53 = la v1.0.1 : AUCUN changement de code. La description du magasin passe du Markdown
#      (que F-Droid affichait tel quel, soulignements « === » compris) au HTML qu'il met
#      en forme. Un nouveau tag est nécessaire parce que F-Droid lit les métadonnées
#      fastlane dans l'arbre du commit référencé par l'entrée de build, pas au HEAD
#      (fdroiddata/tools/check-fastlane.py : vcs.gotorevision(build.commit)).
# 54 = la v1.0.2 : retrait du plugin foojay-resolver de settings.gradle.kts, ce qui rend le
#      build REPRODUCTIBLE. Mesuré : sa présence changeait classes.dex (R8 renommait autrement,
#      +7 field_ids) et le profil ART. Comme la recette F-Droid le retirait par sed alors que la
#      release était construite avec, les deux binaires ne pouvaient pas coïncider — ce qui
#      interdisait Binaries/AllowedAPKSigningKeys, donc la signature Files Tech sur F-Droid.
#      Aucun changement fonctionnel.
# 55 = la v1.0.3 : `dependenciesInfo { includeInApk = false }`. AGP glissait la liste chiffree
#      de nos dependances dans le bloc de signature de l'APK, a destination de la console Play.
#      Le scanner F-Droid le refuse (« extra signing block 'Dependency metadata' ») et il ne
#      pouvait pas apparaitre avant : tant que `Binaries:` n'etait pas declare, il n'analysait
#      que l'APK NON SIGNE qu'il reconstruisait. Aucun changement fonctionnel.
versionCode=55
versionName=1.0.3
