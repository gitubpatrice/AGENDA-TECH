# Agenda Tech — surveillance des dépendances (audit AG-19).
#
# Le dépôt n'avait que `ci.yml` : ni Dependabot, ni analyse de sécurité, là où d'autres applications
# du portefeuille en ont trois ou quatre. Rien ne signalait donc qu'une dépendance embarquait une
# faille connue — sur une application qui chiffre l'agenda de ses utilisateurs.
#
# ⚠️ POINT D'ATTENTION, à lire avant de fusionner quoi que ce soit ici.
#
# `androidx.work` et `androidx.documentfile` sont **volontairement figés** aux versions que Glance
# résout déjà (2.7.1 et 1.0.0), pour qu'AUCUN artefact résolu ne change tant que la MR F-Droid
# !42991 n'est pas fusionnée : la vérification de build reproductible repose là-dessus. Une PR
# Dependabot qui les remonte doit être **fermée**, pas fusionnée, jusqu'à cette fusion.
#
# Les deux écosystèmes sont surveillés parce que les actions GitHub sont, elles aussi, du code
# exécuté avec accès au dépôt.
version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Groupées : dix PR isolées se ferment sans être lues, une PR groupée se relit.
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin-et-outils:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.dagger*"
          - "io.gitlab.arturbosch.detekt*"
      # Jupiter et le lanceur JUnit Platform doivent monter ENSEMBLE : proposés séparément (PR #17 et
      # #19, 2026-09-14), chacun cassait le démarrage des tests en désaccordant l'autre.
      junit:
        patterns:
          - "org.junit*"
    ignore:
      # Cf. l'avertissement en tête de fichier. À retirer une fois !42991 fusionnée.
      - dependency-name: "androidx.work:*"
      - dependency-name: "androidx.documentfile:*"
      # Kotlin 2.4.20+ : CodeQL 2.27 refuse de compiler (« currently supports versions below
      # 2.4.20 », mesuré sur la PR #14). Une PR de montée échouerait à chaque passage. À retirer
      # dès qu'une version de CodeQL le supporte — et retirer alors aussi
      # `-Xannotation-default-target` dans app/build.gradle.kts, redondant en 2.4.
      - dependency-name: "org.jetbrains.kotlin*"
        versions: [">= 2.4.20"]
      # kotlinx-serialization reste en 1.7.3 : c'est lui qui écrit le fichier .atbak (tout l'agenda de
      # l'utilisateur), format vérifié contre une implémentation Python indépendante. La raison complète
      # est en commentaire dans app/build.gradle.kts, près de `kspAndroidTest`. PR #16 fermée pour ça.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
